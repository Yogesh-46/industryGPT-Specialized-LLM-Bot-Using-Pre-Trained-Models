# DataPilot AI — curated knowledge source inventory (Dataset A)
# IMPORTANT:
# - This is a curated inventory of official documentation pages.
# - Do NOT scrape entire sites indiscriminately.
# - Collect only listed URLs (plus closely related pages explicitly added later).
# - Respect robots.txt, terms of use, rate limits, and copyright.
# - Store provenance (source, title, url, collected_at) for every document.
# - Dataset A HTML is collected into data/raw/ (42/42 in the V1 inventory).

inventory_version: "0.1.2"
created_for: DataPilot AI Master's Project
collection_status: collected_v1  # 42/42 HTML in data/raw/; re-runs skip unless --force
notes: >
  URLs below are curated targets for the BI Knowledge Hub.
  Collect only these URLs via scripts/collect_documents.py.
  Prefer official documentation pages. Cleaning/chunking: notebooks/02.

politeness:
  respect_robots_txt: true
  default_delay_seconds: 1.5
  user_agent_env: DATAPILOT_USER_AGENT
  max_retries: 3

sources:
